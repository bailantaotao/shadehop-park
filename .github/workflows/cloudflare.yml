name: Deploy to Cloudflare Pages
# One-time setup: add repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID. Optional repository variables: CF_PAGES_PROJECT (default
# shadehop-park) and SITE_URL (default https://<project>.pages.dev, or your custom domain).
on:
  push:
  workflow_run:
    workflows: ["Refresh data"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'shadehop-park' }}
      BRANCH: ${{ github.event.repository.default_branch }}
      WRANGLER: wrangler@4.139.0
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Build site
        if: steps.creds.outputs.ok == 'true'
        run: |
          pip install -r requirements.txt
          python -m sitegen.build_site
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.pages.dev', vars.CF_PAGES_PROJECT || 'shadehop-park') }}
      - name: Create Pages project if missing
        if: steps.creds.outputs.ok == 'true'
        run: |
          if npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT"; then
            echo "project $PROJECT exists"
          else
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch "$BRANCH"
          fi
      - name: Pass the weather key to Pages Functions
        if: steps.creds.outputs.ok == 'true'
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          if [ -z "$CWA_API_KEY" ]; then echo "::warning::CWA_API_KEY not set; /api/weather will answer 503"; exit 0; fi
          printf '%s' "$CWA_API_KEY" | npx --yes "$WRANGLER" pages secret put CWA_API_KEY --project-name "$PROJECT"
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes "$WRANGLER" pages deploy public --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true
      - name: Smoke-test the live site
        if: steps.creds.outputs.ok == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.pages.dev', vars.CF_PAGES_PROJECT || 'shadehop-park') }}
        run: |
          sleep 15
          fail=0
          for path in / /llms.txt /sitemap.xml /robots.txt /openapi.json /api/parks.geojson /api/parks.json /api/regions/index.json /api/casters/index.json /about/; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$SITE_URL$path")
            echo "$code $SITE_URL$path"
            [ "$code" = 200 ] || fail=1
          done
          first=$(ls data/parks | head -1 | sed 's/\.json$//')
          code=$(curl -s -o /tmp/park -w '%{http_code}' "$SITE_URL/parks/$first/")
          echo "$code $SITE_URL/parks/$first/"; [ "$code" = 200 ] || fail=1
          grep -q '"@type": "Playground"' /tmp/park || { echo "JSON-LD missing"; fail=1; }
          grep -q "$SITE_URL/parks/" <(curl -s "$SITE_URL/sitemap.xml") || { echo "sitemap URLs do not match SITE_URL"; fail=1; }
          curl -sI "$SITE_URL/api/parks.geojson" | grep -i -E '^(content-type|access-control-allow-origin):'
          exit $fail
