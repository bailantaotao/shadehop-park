name: Refresh data
# Fetches OpenStreetMap data and official registries for every region, recomputes shade / parking / chargers,
# and commits the result back to the branch that triggered the run.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 0" # Mondays 03:17 Asia/Taipei
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/data.yml"
permissions:
  contents: write
concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Extract OSM (Geofabrik Taiwan extract; Overpass as fallback)
        run: python -m pipeline.extract_pbf || python -m pipeline.fetch_osm
      - name: Fetch city park registry
        run: python -m pipeline.fetch_city
      - name: Build data
        run: python -m pipeline.build_data
      - name: Commit
        run: |
          git config user.name "shadehop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "Refresh ${{ github.ref_name }} data from OpenStreetMap"
          # If someone pushed data or code while this ran, their push starts its own refresh
          # with newer code; drop this result instead of failing on a data conflict.
          if ! git pull --rebase origin "${{ github.ref_name }}"; then
            git rebase --abort
            echo "::notice::Branch changed during the refresh; skipping this commit (the newer push refreshes data itself)."
            exit 0
          fi
          # GitHub occasionally applies a push but reports "cannot lock ref"; accept it when the
          # branch now points at our commit.
          git push origin "HEAD:${{ github.ref_name }}" || {
            git fetch origin "${{ github.ref_name }}"
            test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          }
